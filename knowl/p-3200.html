<p>We've observed that several different familiar functions grow without bound as <span class="process-math">\(x \to \infty\text{,}\)</span> including <span class="process-math">\(f(x) = \ln(x)\text{,}\)</span> <span class="process-math">\(g(x) = x^2\text{,}\)</span> and <span class="process-math">\(h(x) = e^x\text{.}\)</span>  In this exercise, we compare and contrast how these three functions grow.</p>
