<div class="para logical">
<div class="para">A line with slope <span class="process-math">\(m\)</span> (equivalently, average rate of change <span class="process-math">\(m\)</span>) that passes through the point <span class="process-math">\((x_0,y_0)\)</span> has equation</div>

y = y_0 + m(x-x_0)\text{.}
\end{equation*}
