<div class="para logical">
<div class="para">The absolute value of a real number, denoted by <span class="process-math">\(A(x) = |x|\text{,}\)</span> is defined by the rule</div>
<div class="displaymath process-math">
\begin{equation*}
A(x) = 
\begin{cases}
-x, \amp  x \lt  0 \\
x, \amp x \ge 0
\end{cases}
\end{equation*}
</div>
