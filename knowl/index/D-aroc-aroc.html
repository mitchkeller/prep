<div class="para logical">
<div class="para">For a function <span class="process-math">\(f\)</span> defined on an interval <span class="process-math">\([a,b]\text{,}\)</span> the <dfn class="terminology">average rate of change of <span class="process-math">\(f\)</span> on <span class="process-math">\([a,b]\)</span></dfn> is the quantity</div>
<div class="displaymath process-math">
\begin{equation*}
AV_{[a,b]} = \frac{f(b) - f(a)}{b-a}\text{.}
\end{equation*}
</div>
