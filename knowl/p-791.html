<h4 class="heading"><span class="type">Paragraph</span></h4>
<p>Whenever we have two functions, say <span class="process-math">\(g : A \to B\)</span> and <span class="process-math">\(f : B \to C\text{,}\)</span> where the codomain of <span class="process-math">\(g\)</span> matches the domain of <span class="process-math">\(f\text{,}\)</span> it is possible to link the two processes together to create a new process that we call the <em class="emphasis">composition</em> of <span class="process-math">\(f\)</span> and <span class="process-math">\(g\text{.}\)</span></p>
