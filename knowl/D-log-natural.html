<p>Given a positive real number <span class="process-math">\(y\text{,}\)</span> the <dfn class="terminology">natural logarithm of <span class="process-math">\(y\)</span></dfn> is the power to which we raise <span class="process-math">\(e\)</span> to get <span class="process-math">\(y\text{.}\)</span>  We use the notation “<span class="process-math">\(\ln(y)\)</span>” to denote the natural logarithm of <span class="process-math">\(y\text{.}\)</span></p></article><span class="incontext"><a href="sec-exp-log.html#D-log-natural" class="internal">in-context</a></span>
