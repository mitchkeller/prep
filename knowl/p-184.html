<h4 class="heading"><span class="type">Paragraph</span></h4>
<p>A graph in the plane represents a function if and only if every vertical line intersects the graph at most once.  When the graph passes this test, the vertical coordinate of each point on the graph can be viewed as a function of the horizontal coordinate of the point.</p>
