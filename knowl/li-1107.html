<p>For any real number <span class="process-math">\(t\)</span> for which <span class="process-math">\(\cos(t) \ne 0\text{,}\)</span> we define the secant of <span class="process-math">\(t\text{,}\)</span> denoted <span class="process-math">\(\sec(t)\text{,}\)</span> by the rule</p>
<div class="displaymath process-math" data-contains-math-knowls="">
\begin{equation*}
\sec(t) = \frac{1}{\cos(t)}\text{.}
\end{equation*}
