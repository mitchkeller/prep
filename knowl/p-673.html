<p>Next, observe that the vertex of <span class="process-math">\(q\)</span> is <span class="process-math">\((2,2.5)\text{.}\)</span>  This holds because <span class="process-math">\((x-2)^2\)</span> is always greater than or equal to <span class="process-math">\(0\text{,}\)</span> and thus its smallest possible value is <span class="process-math">\(0\)</span> when <span class="process-math">\(x = 2\text{.}\)</span>  Moreover, when <span class="process-math">\(x = 2\text{,}\)</span> <span class="process-math">\(q(2) = 2.5\text{.}\)</span><a href="" class="fn-knowl original" data-knowl="./knowl/fn-35-hidden.html" title="Footnote 1.5.2"><sup> 2 </sup></a></p>
