<p>The absolute value of a real number, denoted by <span class="process-math">\(A(x) = |x|\text{,}\)</span> is defined by the rule</p>
<div class="displaymath process-math" data-contains-math-knowls="">
\begin{equation*}
A(x) = 
\begin{cases}
-x, \amp  x \lt  0 \\
x, \amp x \ge 0
\end{cases}
\end{equation*}
</div></article></p>
