<p>Indeed, for any point <span class="process-math">\((a,b)\)</span> that lies on the graph of <span class="process-math">\(E(x) = e^x\text{,}\)</span> it follows that the point <span class="process-math">\((b,a)\)</span> lies on the graph of the inverse <span class="process-math">\(N(x) = \ln(x)\text{.}\)</span>  From this, we see several important properties of the graph of the logarithm function.</p>
