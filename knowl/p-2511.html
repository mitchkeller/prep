<p>Recall that <span class="process-math">\(y = \log_b(x)\text{.}\)</span>  Explain why the following equation (often called the Golden Rule for Logarithms) is true:</p>

\begin{equation*}
\log_b(x) = \frac{\ln(x)}{\ln(b)}\text{.}
