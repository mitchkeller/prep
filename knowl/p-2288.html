<p>Given a positive real number <span class="process-math">\(y\text{,}\)</span> the <dfn class="terminology">base-<span class="process-math">\(10\)</span> logarithm of <span class="process-math">\(y\)</span></dfn> is the power to which we raise <span class="process-math">\(10\)</span> to get <span class="process-math">\(y\text{.}\)</span>  We use the notation “<span class="process-math">\(\log_{10}(y)\)</span>” to denote the base-<span class="process-math">\(10\)</span> logarithm of <span class="process-math">\(y\text{.}\)</span></p>
