<span class="type">Item</span><span class="period">.</span>
</h4>
<p>For any <span class="process-math">\(y\)</span> such that <span class="process-math">\(-1 \le y \le 1\text{,}\)</span> the arccosine of <span class="process-math">\(y\)</span> (denoted <span class="process-math">\(\arccos(y)\)</span>) is the angle <span class="process-math">\(t\)</span> in the interval <span class="process-math">\([0,\pi]\)</span> such that <span class="process-math">\(\cos(t) = y\text{.}\)</span>  That is, <span class="process-math">\(t\)</span> is the angle whose cosine is <span class="process-math">\(y\text{.}\)</span></p></article><span class="incontext"><a href="sec-trig-inverse.html#li-1054" class="internal">in-context</a></span>
