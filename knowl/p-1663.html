<p>Moreover, if we now plot these points in the usual way, as we did in <a href="" class="xref" data-knowl="./knowl/PA-circular-sine.html" title="Preview Activity 2.3.1">Preview Activity 2.3.1</a>, we get the familiar circular wave function that comes from tracking the height of a point traversing a circle.  We often call the the graph in <a href="" class="xref" data-knowl="./knowl/F-circular-sine-graph.html" title="Figure 2.3.7">Figure 2.3.7</a> the <em class="emphasis">sine wave</em>.</p>
