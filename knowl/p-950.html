<h4 class="heading"><span class="type">Paragraph</span></h4>
<p>Note particularly what the equation <span class="process-math">\(g(f(a)) = a\)</span> says:  for any input <span class="process-math">\(a\)</span> in the domain of <span class="process-math">\(f\text{,}\)</span> the function <span class="process-math">\(g\)</span> will reverse the process of <span class="process-math">\(f\)</span> (which converts <span class="process-math">\(a\)</span> to <span class="process-math">\(f(a)\)</span>) because <span class="process-math">\(g\)</span> converts <span class="process-math">\(f(a)\)</span> back to <span class="process-math">\(a\text{.}\)</span></p>
