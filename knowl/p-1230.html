<h3 class="heading"><span class="type">Paragraph</span></h3>
<p>In arithmetic, we execute processes where we take two numbers to generate a new number.  For example, <span class="process-math">\(2 + 3 = 5\text{:}\)</span>  the number <span class="process-math">\(5\)</span> results from adding <span class="process-math">\(2\)</span> and <span class="process-math">\(3\text{.}\)</span>  Similarly, we can multiply two numbers to generate a new one:  <span class="process-math">\(2 \cdot 3 = 6\text{.}\)</span></p>
