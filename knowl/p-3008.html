<p>For any real number <span class="process-math">\(t\)</span> for which <span class="process-math">\(\sin(t) \ne 0\text{,}\)</span> we define the cosecant of <span class="process-math">\(t\text{,}\)</span> denoted <span class="process-math">\(\csc(t)\text{,}\)</span> by the rule</p>
<div class="displaymath process-math" data-contains-math-knowls="">
\begin{equation*}
\csc(t) = \frac{1}{\sin(t)}\text{.}
\end{equation*}
</div>
