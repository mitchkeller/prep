<p>For an object tossed vertically from an initial height of <span class="process-math">\(s_0\)</span> feet with a velocity of <span class="process-math">\(v_0\)</span> feet per second, the object's height at time <span class="process-math">\(t\)</span> (in seconds) is given by the formula</p>
<div class="displaymath process-math" data-contains-math-knowls="">
\begin{equation*}
h(t) = -16t^2 + v_0t + s_0
\end{equation*}
</div>
