<p>As we can see in <a href="" class="xref" data-knowl="./knowl/F-quadratic-3-CCU.html" title="Figure 1.5.3">Figure 1.5.3</a>, by shifting the graph of a quadratic function vertically, we can make its graph cross the <span class="process-math">\(x\)</span>-axis <span class="process-math">\(0\)</span> times (as in the graph of <span class="process-math">\(p\)</span>), exactly <span class="process-math">\(1\)</span> time (<span class="process-math">\(q\)</span>), or twice (<span class="process-math">\(r\)</span>).  These points are the <span class="process-math">\(x\)</span>-intercepts of the graph.</p>
