<p>If we compute the average rate of change of a function on an interval, we can decide if the function is increasing or decreasing <em class="emphasis">on average</em> on the interval, but it takes more work<a href="" class="fn-knowl original" data-knowl="./knowl/fn-29-hidden.html" title="Footnote 1.3.2"><sup> 2 </sup></a> to decide if the function is increasing or decreasing <em class="emphasis">always</em> on the interval.</p>
