<h4 class="heading"><span class="type">Paragraph</span></h4>
<p>A linear function <span class="process-math">\(y = f(x)\)</span> can be written in the form <span class="process-math">\(y = f(x) = y_0 + m(x-x_0)\text{,}\)</span> where <span class="process-math">\(m\)</span> is the slope of the line and <span class="process-math">\((x_0,y_0)\)</span> is a point that lies on the line.  In particular, <span class="process-math">\(f(x_0) = y_0\text{.}\)</span></p>
