<h4 class="heading"><span class="type">Paragraph</span></h4>
<p>A similar property holds for <span class="process-math">\(\ln(\frac{a}{b})\text{.}\)</span>  By nearly the same argument, we can say that</p>
<div class="displaymath process-math" data-contains-math-knowls="">
\begin{align*}
\ln\left( \frac{a}{b} \right) &amp;= \ln\left( \frac{e^x}{e^y} \right)\\
&amp;= \ln \left( e^{x-y} \right)\\
&amp;= x-y\\
&amp;= \ln(a) - \ln(b)\text{.}
\end{align*}
</div>
