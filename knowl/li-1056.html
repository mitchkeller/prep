<span class="type">Item</span><span class="period">.</span>
</h4>
<p>For any real number <span class="process-math">\(y\text{,}\)</span> the arctangent of <span class="process-math">\(y\)</span> (denoted <span class="process-math">\(\arctan(y)\)</span>) is the angle <span class="process-math">\(t\)</span> in the interval <span class="process-math">\((-\frac{\pi}{2}, \frac{\pi}{2})\)</span> such that <span class="process-math">\(\tan(t) = y\text{.}\)</span>  That is, <span class="process-math">\(t\)</span> is the angle whose tangent is <span class="process-math">\(y\text{.}\)</span></p></article><span class="incontext"><a href="sec-trig-inverse.html#li-1056" class="internal">in-context</a></span>
