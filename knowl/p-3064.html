<p>Recall that for any function <span class="process-math">\(f\)</span> on an interval <span class="process-math">\([a,a+h]\text{,}\)</span> its average rate of change is</p>
<div class="displaymath process-math" data-contains-math-knowls="">
\begin{equation*}
AV_{[a,a+h]} = \frac{f(a+h)-f(a)}{h}\text{.}
\end{equation*}
