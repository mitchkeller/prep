<p>A rational function is a function whose formula can be written as the ratio of two polynomial functions.  For instance, <span class="process-math">\(r(x) = \frac{7x^3 - 5x + 16}{-4x^4 + 2x^3 - 11x + 3}\)</span> is a rational function.</p></article><span class="incontext"><a href="sec-poly-rational.html#li-1300" class="internal">in-context</a></span>
