<p>The restricted cosine function, <span class="process-math">\(y = g(t) = \cos(t)\text{,}\)</span> is defined on the domain <span class="process-math">\([0,\pi]\)</span> with range <span class="process-math">\([-1,1]\text{.}\)</span>  This function has an inverse function that we call the arccosine function, denoted <span class="process-math">\(t = g^{-1}(y) = \arccos(y)\text{.}\)</span></p>
