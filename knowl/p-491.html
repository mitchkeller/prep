<p><em class="emphasis">Solution</em>.  Using <a href="" class="xref" data-knowl="./knowl/E-linear-point-slope-first-take.html" title="Equation 1.4.1">Equation (1.4.1)</a> and the facts that <span class="process-math">\(m = -\frac{1}{4}\)</span> and <span class="process-math">\(f(-7) = -5\)</span> (that is, <span class="process-math">\(x_0 = -7\)</span> and <span class="process-math">\(f(x_0) = -5\)</span>), we have</p>
<div class="displaymath process-math" data-contains-math-knowls="./knowl/E-linear-point-slope-first-take.html">
\begin{equation*}
f(x) = -5 -\frac{1}{4}(x - (-7)) = -5 - \frac{1}{4}(x+7)\text{.}
\end{equation*}
