<h5 class="heading"><span class="type">Paragraph</span></h5>
<p>Similarly, we say that <span class="process-math">\(f\)</span> is <dfn class="terminology">decreasing on <span class="process-math">\((a,b)\)</span></dfn> provided that the function is always falling as we move from left to right.  That is, for any <span class="process-math">\(x\)</span> and <span class="process-math">\(y\)</span> in <span class="process-math">\((a,b)\text{,}\)</span>  if <span class="process-math">\(x \lt y\text{,}\)</span> then <span class="process-math">\(f(x) \gt f(y)\text{.}\)</span></p>
