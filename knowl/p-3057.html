<p>In calculus, it is also beneficial to know a couple of other standard identities for sums of angles or double angles.   We simply state these identities without justification.  For more information about them, see Section 10.4 in <a class="external" href="http://stitz-zeager.com/szct07042013.pdf/" target="_blank">College Trigonometry</a><a href="" class="fn-knowl original" data-knowl="./knowl/fn-79-hidden.html" title="Footnote 4.5.1"><sup> 1 </sup></a>, by Stitz and Zeager<a href="" class="fn-knowl original" data-knowl="./knowl/fn-80-hidden.html" title="Footnote 4.5.2"><sup> 2 </sup></a>.</p>
